[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-region-rice-mapping"
version = "0.1.0"
description = "Cross-region rice mapping with temporal remote sensing and EO foundation representations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "rasterio>=1.3,<2",
  "geopandas>=0.14,<2",
  "scikit-learn>=1.4,<2",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
earthengine = [
  "earthengine-api>=1.7,<2",
  "requests>=2.31,<3",
  "httplib2>=0.22,<1",
  "google-auth>=2.29,<3",
  "PySocks>=1.7,<2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/test_dl_shapes_and_normalization.py"
